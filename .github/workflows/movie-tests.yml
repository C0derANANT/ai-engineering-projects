# Runs the AI Movie chatbot's tests whenever that project changes.
# Wikipedia, the LLM and Whisper are faked, so the tests need no internet or API keys.
name: AI Movie tests

on:
  push:
    paths:
      - "02-AI-Movie-Chatbot/**"
      - ".github/workflows/movie-tests.yml"
  workflow_dispatch:  # adds a "Run workflow" button in the Actions tab

permissions:
  contents: read  # only needs to read the code

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: 02-AI-Movie-Chatbot
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"  # same as the Render Docker image
          cache: pip
          cache-dependency-path: 02-AI-Movie-Chatbot/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v
