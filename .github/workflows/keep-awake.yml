# Keeps the free Render demo of 01-Brochure-Generator awake.
#
# Render's free plan puts a service to sleep after 15 minutes without visitors, and the
# next visitor then waits 30-60 seconds (seeing a 503 at first) while it starts again.
# Visiting it every 10 minutes stops it from falling asleep. Running all month is about
# 744 hours, inside Render's 750 free hours (as long as it's your only free service).
# GitHub Actions minutes are free for public repositories like this one.
#
# Notes: GitHub can start scheduled runs a few minutes late, and it pauses scheduled
# workflows after 60 days without any commits to the repo (re-enable it in the Actions tab).
name: Keep demo awake

on:
  schedule:
    - cron: "*/10 * * * *"  # every 10 minutes
  workflow_dispatch:         # adds a "Run workflow" button in the Actions tab

permissions: {}  # the job only visits a web page, so it gets no access to the repo

concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Visit the demo
        env:
          DEMO_URL: https://ai-brochure-generator-af0t.onrender.com
        run: |
          # If it was asleep anyway, Render answers 503 while it boots, so retry for ~2 minutes
          curl --fail --silent --show-error --output /dev/null \
            --retry 6 --retry-delay 20 --retry-all-errors --max-time 60 \
            --write-out "HTTP %{http_code} in %{time_total}s\n" \
            "$DEMO_URL"
